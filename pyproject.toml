[project]
name = "saga-mcp"
version = "0.3.0"
description = "Server MCP pentru API-ul SAGA Web (balanta, solduri, stocuri, import facturi/note contabile)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.10,<2",
    "httpx>=0.27",
    "keyring>=25",
]

[project.scripts]
saga-mcp = "saga_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/saga_mcp"]
